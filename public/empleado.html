<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LEVEL Gastrobar | Portal Móvil de Meseros</title>
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #050811;
      --bg-surface: #0b1120;
      --bg-card: #0f172a;
      --bg-card-hover: #16223d;
      --border-card: rgba(0, 243, 255, 0.18);
      --accent-cyan: #00f3ff;
      --accent-emerald: #00ff88;
      --accent-gold: #ffb703;
      --accent-rose: #ff0055;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 95px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.04) 0%, transparent 40%);
    }

    /* HEADER SUPERIOR */
    .emp-header {
      background: rgba(11, 17, 32, 0.88);
      border-bottom: 1px solid var(--border-card);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .emp-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .emp-logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2) 0%, rgba(0, 255, 136, 0.1) 100%);
      border: 1px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      font-size: 15px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
    }

    .emp-brand-title {
      font-family: "Orbitron", sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #fff;
      line-height: 1.1;
    }

    .emp-brand-title span {
      color: var(--accent-cyan);
      background: linear-gradient(90deg, #00f3ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .emp-brand-sub {
      font-size: 9.5px;
      color: var(--accent-gold);
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .emp-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .emp-user-pill {
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--accent-emerald);
      font-size: 10.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .emp-user-pill:active {
      transform: scale(0.95);
      background: rgba(0, 255, 136, 0.25);
    }

    .btn-refresh-mini {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-refresh-mini:active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* SELECTOR TÁCTIL DE MESAS */
    .table-selector-section {
      background: #090e1c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 12px;
    }

    .table-section-title {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-section-title span.current-table-label {
      color: var(--accent-cyan);
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
    }

    .tables-scroll-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .tables-scroll-wrap::-webkit-scrollbar {
      display: none;
    }

    .table-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .table-chip.active {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25) 0%, rgba(0, 255, 136, 0.2) 100%);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.35);
    }

    .table-chip:active {
      transform: scale(0.95);
    }

    /* FILTRO DE CATEGORÍAS */
    .cat-scroll-container {
      display: flex;
      gap: 6px;
      padding: 10px 12px 6px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .cat-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 7px 12px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .cat-chip.active {
      background: rgba(0, 243, 255, 0.16);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .cat-chip:active {
      transform: scale(0.96);
    }

    /* BUSCADOR */
    .search-box {
      padding: 4px 12px 10px 12px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap i.search-icon {
      position: absolute;
      left: 12px;
      color: #64748b;
      font-size: 13px;
    }

    .search-input {
      width: 100%;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 9px 34px 9px 34px;
      border-radius: 10px;
      font-size: 12px;
      outline: none;
      font-family: "Montserrat", sans-serif;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-clear-search {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 13px;
      padding: 6px;
      cursor: pointer;
      display: none;
    }

    /* GRID DE PRODUCTOS MÓVIL */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 12px;
    }

    @media (min-width: 540px) and (max-width: 820px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 0 14px;
      }
    }

    @media (min-width: 821px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        padding: 0 18px;
      }
    }

    .prod-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.18s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .prod-card:active {
      transform: scale(0.97);
      border-color: var(--accent-cyan);
    }

    /* CONTENEDOR DE IMAGEN CON ILUMINACIÓN CYBER */
    .prod-img-box {
      width: 100%;
      height: 120px;
      background: radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, rgba(10, 16, 30, 0.95) 75%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .prod-img-box img {
      max-width: 90%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
      transition: transform 0.25s ease;
    }

    .prod-card:hover .prod-img-box img {
      transform: scale(1.06);
    }

    /* PLACEHOLDER VECTORIAL CUANDO NO HAY FOTO */
    .prod-placeholder-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--accent-cyan);
    }

    .prod-placeholder-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.2);
    }

    .prod-stock-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(5, 10, 20, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--accent-emerald);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .prod-stock-badge.low {
      border-color: var(--accent-rose);
      color: var(--accent-rose);
      background: rgba(255, 0, 85, 0.15);
    }

    .prod-qty-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--accent-cyan);
      color: #040812;
      font-weight: 900;
      font-size: 11px;
      font-family: "Orbitron", sans-serif;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .prod-info {
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .prod-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.25;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 28px;
    }

    .prod-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .prod-price {
      font-family: "Orbitron", sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .btn-add-prod {
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #041009;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.35);
      transition: all 0.15s;
    }

    .btn-add-prod:active {
      transform: scale(0.9);
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.6);
    }

    /* BARRA INFERIOR DE COMANDA */
    .cart-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #0e172a 0%, #080c16 100%);
      border-top: 1px solid var(--accent-emerald);
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 136, 0.2);
      z-index: 1000;
    }

    .cart-bottom-info {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .cart-bottom-count {
      font-size: 10px;
      color: var(--accent-emerald);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cart-bottom-total {
      font-family: "Orbitron", sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #fff;
    }

    .btn-view-cart {
      background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
      color: #03140a;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      font-family: "Orbitron", sans-serif;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.45);
      transition: all 0.2s;
    }

    .btn-view-cart:active {
      transform: scale(0.95);
    }

    /* DRAWER / BOTTOM SHEET DEL CARRITO */
    .cart-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .cart-drawer-overlay.active {
      display: flex;
      opacity: 1;
    }

    .cart-drawer {
      width: 100%;
      max-height: 85vh;
      background: #0d1424;
      border-top: 1px solid var(--accent-cyan);
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.9);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-handle-bar {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 8px auto 4px auto;
    }

    .drawer-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-title {
      font-family: "Orbitron", sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-mesa-badge {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      font-family: "Orbitron", sans-serif;
    }

    .btn-close-drawer {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #94a3b8;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .drawer-items-list {
      padding: 10px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 40vh;
    }

    .cart-item-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }

    .cart-item-name {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-size: 11px;
      color: var(--accent-gold);
      font-weight: 700;
      margin-top: 2px;
      font-family: "Orbitron", sans-serif;
    }

    .cart-item-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-step {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      background: rgba(0, 243, 255, 0.1);
      color: var(--accent-cyan);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-step.del {
      border-color: rgba(255, 0, 85, 0.4);
      background: rgba(255, 0, 85, 0.1);
      color: var(--accent-rose);
    }

    .step-val {
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      min-width: 20px;
      text-align: center;
    }

    .drawer-note-section {
      padding: 8px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .drawer-note-input {
      width: 100%;
      background: #080c16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      outline: none;
      font-family: "Montserrat", sans-serif;
    }

    .drawer-footer {
      padding: 12px 16px 16px 16px;
      background: #070a14;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-total-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
    }

    .drawer-total-val {
      font-family: "Orbitron", sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-gold);
    }

    .btn-send-order {
      width: 100%;
      background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
      color: #03140a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.45);
    }

    .btn-send-order:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MODAL DE ÉXITO */
    .success-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-modal.active {
      display: flex;
    }

    .success-card {
      background: linear-gradient(160deg, #0e172a 0%, #070d18 100%);
      border: 1px solid var(--accent-emerald);
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.35);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .success-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 255, 136, 0.15);
      border: 2px solid var(--accent-emerald);
      color: var(--accent-emerald);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 12px auto;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    .success-title {
      font-family: "Orbitron", sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .success-msg {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .btn-new-order {
      width: 100%;
      background: linear-gradient(135deg, #00f3ff 0%, #0088cc 100%);
      color: #020c16;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.35);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="emp-header">
    <div class="emp-brand">
      <div class="emp-logo-icon">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <div>
        <div class="emp-brand-title">LEVEL <span>GASTROBAR</span></div>
        <div class="emp-brand-sub"><i class="fa-solid fa-mobile-screen"></i> PEDIDOS MÓVILES</div>
      </div>
    </div>

    <div class="emp-header-actions">
      <div class="emp-user-pill" onclick="changeEmployeeName()" title="Tocar para cambiar mesero">
        <i class="fa-solid fa-user-tie"></i>
        <span id="lblEmployeeName">Mesero 1</span>
      </div>
      <button type="button" class="btn-refresh-mini" onclick="loadCatalog()" title="Recargar menú">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </header>

  <!-- SELECTOR TÁCTIL DE MESAS -->
  <section class="table-selector-section">
    <div class="table-section-title">
      <span><i class="fa-solid fa-table-cells-large"></i> SELECCIONA LA MESA:</span>
      <span class="current-table-label" id="lblCurrentTable">Mesa 1</span>
    </div>
    <div class="tables-scroll-wrap" id="tablesScrollWrap">
      <!-- Generado dinámicamente -->
    </div>
  </section>

  <!-- CATEGORÍAS -->
  <div class="cat-scroll-container" id="catScroll">
    <div class="cat-chip active" onclick="filterCat('todos', this)"><i class="fa-solid fa-fire"></i> Todos</div>
    <div class="cat-chip" onclick="filterCat('cervezas', this)"><i class="fa-solid fa-beer-mug-empty"></i> Cervezas</div>
    <div class="cat-chip" onclick="filterCat('micheladas', this)"><i class="fa-solid fa-martini-glass-citrus"></i> Micheladas</div>
    <div class="cat-chip" onclick="filterCat('licores', this)"><i class="fa-solid fa-wine-bottle"></i> Licores</div>
    <div class="cat-chip" onclick="filterCat('whisky', this)"><i class="fa-solid fa-glass-whiskey"></i> Whisky</div>
    <div class="cat-chip" onclick="filterCat('comida', this)"><i class="fa-solid fa-burger"></i> Comida</div>
    <div class="cat-chip" onclick="filterCat('otros', this)"><i class="fa-solid fa-cubes"></i> Otros</div>
  </div>

  <!-- BUSCADOR -->
  <div class="search-box">
    <div class="search-input-wrap">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="txtSearch" class="search-input" placeholder="Buscar producto o sabor..." oninput="onSearchInput()">
      <button type="button" id="btnClearSearch" class="btn-clear-search" onclick="clearSearch()"><i class="fa-solid fa-circle-xmark"></i></button>
    </div>
  </div>

  <!-- GRID DE PRODUCTOS -->
  <main class="products-grid" id="productsGrid">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 0; color: #64748b;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: var(--accent-cyan);"></i>
      <p style="margin-top: 10px; font-size: 13px;">Cargando catálogo de productos...</p>
    </div>
  </main>

  <!-- BARRA FLOTANTE DE COMANDA (INFERIOR) -->
  <div class="cart-bottom-bar" id="cartBottomBar" onclick="openCartDrawer()">
    <div class="cart-bottom-info">
      <div class="cart-bottom-count" id="lblBottomCount">
        <i class="fa-solid fa-basket-shopping"></i> 0 PRODUCTOS
      </div>
      <div class="cart-bottom-total" id="lblBottomTotal">$0</div>
    </div>
    <button type="button" class="btn-view-cart" onclick="event.stopPropagation(); openCartDrawer()">
      <span>VER COMANDA</span>
      <i class="fa-solid fa-chevron-up"></i>
    </button>
  </div>

  <!-- DRAWER / PANEL INFERIOR DE COMANDA -->
  <div class="cart-drawer-overlay" id="cartDrawerOverlay" onclick="closeCartDrawer()">
    <div class="cart-drawer" onclick="event.stopPropagation()">
      <div class="drawer-handle-bar"></div>
      
      <div class="drawer-header">
        <div class="drawer-title">
          <i class="fa-solid fa-clipboard-list text-cyan"></i>
          <span>COMANDA</span>
          <span class="drawer-mesa-badge" id="lblDrawerMesa">Mesa 1</span>
        </div>
        <button type="button" class="btn-close-drawer" onclick="closeCartDrawer()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="drawer-items-list" id="drawerItemsList">
        <!-- Ítems del carrito -->
      </div>

      <div class="drawer-note-section">
        <input type="text" id="txtOrderNote" class="drawer-note-input" placeholder="Nota para barra / cocina (ej: bien frío, sin pitillo)...">
      </div>

      <div class="drawer-footer">
        <div class="drawer-total-row">
          <span class="drawer-total-label">Total a Pagar:</span>
          <span class="drawer-total-val" id="lblDrawerTotal">$0</span>
        </div>
        <button type="button" class="btn-send-order" id="btnSendOrder" onclick="submitOrderToCaja()">
          <i class="fa-solid fa-paper-plane"></i>
          <span>ENVIAR PEDIDO A CAJA</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN -->
  <div class="success-modal" id="successModal">
    <div class="success-card">
      <div class="success-icon-wrap"><i class="fa-solid fa-check"></i></div>
      <h3 class="success-title">¡PEDIDO ENVIADO!</h3>
      <p class="success-msg" id="lblSuccessMsg">La comanda se registró exitosamente en la caja física.</p>
      <button type="button" class="btn-new-order" onclick="resetNewOrder()">
        <i class="fa-solid fa-plus"></i> TOMAR OTRO PEDIDO
      </button>
    </div>
  </div>

  <script>
    const LOCAL_IMAGE_MAP = {
      "club colombia": "images/Club colombia.png",
      "redd's": "images/Redd,s.png",
      "redds": "images/Redd,s.png",
      "coronita": "images/Coronita.png",
      "corona": "images/Corona.png",
      "michelada soda ginger": "images/Michelada soda ginger.png",
      "michelada coronita": "images/michelada coronita.png",
      "michelada club colombia": "images/Michelada club colombia.png",
      "michelada redd's": "images/Micheladas Redd,s.jpg",
      "michelada redds": "images/Micheladas Redd,s.jpg",
      "michelada corona": "images/Michelada Corona.png",
      "aguardiente putumayo 1/2": "images/Aguardiente media.png",
      "aguardiente media": "images/Aguardiente media.png",
      "ron viejo caldas 1/2": "images/Ron viejos de caldas media .png",
      "ron viejo de caldas 1/2": "images/Ron viejos de caldas media .png",
      "ron caldas 8 años 1/2": "images/Ron de caldas 8 años.webp",
      "tequila olmeca 1/2": "images/Tequila olmeca media.ng.jpg",
      "aguardiente putumayo": "images/Aguadiente Putumayo botello.png",
      "ron viejo de caldas": "images/Ron viejos de caldas media .png",
      "ron viejo caldas": "images/Ron viejos de caldas media .png",
      "ron caldas 8 años": "images/Ron de caldas 8 años.webp",
      "tequila olmeca": "images/Tequila olmeca media.ng.jpg",
      "smirnoff lulo": "images/smirnoff vodka.png",
      "smirnoff vodka": "images/smirnoff vodka.png",
      "smirnoff tamarindo": "images/smirnoff Tamarindo.png",
      "old parr": "images/old parr.png",
      "chivas regal": "images/Chivas regal.png",
      "jack daniel's": "images/jack danniel.png",
      "jack daniels": "images/jack danniel.png",
      "buchanan's deluxe": "images/Buchanan´s Deluxe.webp",
      "buchanans deluxe": "images/Buchanan´s Deluxe.webp",
      "buchanan's deluxe 12 a": "images/Buchanan´s Deluxe.webp",
      "buchanan's two souls": "images/Buchanan´s Two sould.png",
      "buchanans two souls": "images/Buchanan´s Two sould.png",
      "buchanan's master": "images/Buchanan´s Master.webp",
      "buchanans master": "images/Buchanan´s Master.webp"
    };

    const PRESET_TABLES = [
      'Mesa 1', 'Mesa 2', 'Mesa 3', 'Mesa 4', 'Mesa 5', 
      'Mesa 6', 'Mesa 7', 'Mesa 8', 'Mesa 9', 'Mesa 10',
      'Barra 1', 'Barra 2', 'VIP 1', 'VIP 2', 'Terraza'
    ];

    let allProducts = [];
    let currentCategory = 'todos';
    let currentCart = {};
    let selectedMesa = 'Mesa 1';
    let currentEmployee = localStorage.getItem('level_empleado_name') || 'Mesero 1';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lblEmployeeName').textContent = currentEmployee;
      renderTableChips();
      loadCatalog();
    });

    function renderTableChips() {
      const container = document.getElementById('tablesScrollWrap');
      let html = PRESET_TABLES.map(t => `
        <div class="table-chip ${t === selectedMesa ? 'active' : ''}" onclick="selectTable('${t}')">
          <i class="fa-solid fa-chair"></i> ${t}
        </div>
      `).join('');

      html += `
        <div class="table-chip" onclick="promptCustomTable()">
          <i class="fa-solid fa-plus"></i> Otra...
        </div>
      `;
      container.innerHTML = html;
      document.getElementById('lblCurrentTable').textContent = selectedMesa;
      document.getElementById('lblDrawerMesa').textContent = selectedMesa;
    }

    function selectTable(mesaName) {
      selectedMesa = mesaName;
      if (navigator.vibrate) navigator.vibrate(20);
      renderTableChips();
    }

    function promptCustomTable() {
      const val = prompt('Ingresa el nombre o número de la mesa/ubicación:', 'Mesa ');
      if (val && val.trim()) {
        const clean = val.trim();
        if (!PRESET_TABLES.includes(clean)) {
          PRESET_TABLES.push(clean);
        }
        selectTable(clean);
      }
    }

    function changeEmployeeName() {
      const name = prompt('Ingresa tu nombre o número de mesero:', currentEmployee);
      if (name && name.trim()) {
        currentEmployee = name.trim();
        localStorage.setItem('level_empleado_name', currentEmployee);
        document.getElementById('lblEmployeeName').textContent = currentEmployee;
      }
    }

    function resolveImageSrc(p) {
      if (p.image && p.image !== 'images/default_product.png' && !p.image.includes('placeholder')) {
        return p.image;
      }
      const cleanName = (p.name || '').toLowerCase().trim();
      if (LOCAL_IMAGE_MAP[cleanName]) {
        return LOCAL_IMAGE_MAP[cleanName];
      }
      for (const [key, val] of Object.entries(LOCAL_IMAGE_MAP)) {
        if (cleanName.includes(key) || key.includes(cleanName)) {
          return val;
        }
      }
      return 'images/default_product.png';
    }

    function getCategoryIcon(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('cerveza')) return 'fa-beer-mug-empty';
      if (c.includes('michelada')) return 'fa-martini-glass-citrus';
      if (c.includes('licor') || c.includes('ron') || c.includes('aguardiente') || c.includes('tequila')) return 'fa-wine-bottle';
      if (c.includes('whisky') || c.includes('whiskey')) return 'fa-glass-whiskey';
      if (c.includes('comida') || c.includes('snack') || c.includes('alimento')) return 'fa-burger';
      return 'fa-cubes';
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/inventory?t=' + Date.now());
        if (!res.ok) throw new Error('Error al conectar con el servidor');
        const data = await res.json();
        allProducts = data.products || [];
        renderProductsList(filterProductsList());
      } catch (err) {
        document.getElementById('productsGrid').innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:35px 15px; color:#ff4466;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:32px;"></i>
            <p style="margin-top:10px; font-weight:700; font-size:13px;">No se pudo cargar el menú</p>
            <p style="font-size:11px; color:#94a3b8; margin-top:4px;">Verifica la conexión con el servidor.</p>
            <button onclick="loadCatalog()" style="margin-top:14px; background:rgba(0,243,255,0.15); color:#00f3ff; border:1px solid #00f3ff; padding:8px 18px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer;">
              <i class="fa-solid fa-rotate"></i> Reintentar
            </button>
          </div>
        `;
      }
    }

    function filterCat(cat, chipEl) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      renderProductsList(filterProductsList());
    }

    function onSearchInput() {
      const val = document.getElementById('txtSearch').value || '';
      document.getElementById('btnClearSearch').style.display = val.length > 0 ? 'block' : 'none';
      renderProductsList(filterProductsList());
    }

    function clearSearch() {
      document.getElementById('txtSearch').value = '';
      document.getElementById('btnClearSearch').style.display = 'none';
      renderProductsList(filterProductsList());
    }

    function filterProductsList() {
      const search = (document.getElementById('txtSearch').value || '').toLowerCase().trim();
      return allProducts.filter(p => {
        const cat = (p.category || p.categoria || 'otros').toLowerCase();
        const matchCat = currentCategory === 'todos' || cat === currentCategory;
        const matchSearch = !search || (p.name || p.nombre || '').toLowerCase().includes(search);
        return matchCat && matchSearch;
      });
    }

    function handleImageError(imgEl, category, prodName) {
      imgEl.onerror = null;
      const parent = imgEl.parentElement;
      if (parent) {
        const iconClass = getCategoryIcon(category);
        parent.innerHTML = `
          <div class="prod-placeholder-box">
            <div class="prod-placeholder-icon">
              <i class="fa-solid ${iconClass}"></i>
            </div>
          </div>
        `;
      }
    }

    function renderProductsList(products) {
      const container = document.getElementById('productsGrid');
      if (!products || products.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: #64748b;">
            <i class="fa-solid fa-box-open" style="font-size: 32px;"></i>
            <p style="margin-top: 10px; font-size: 13px;">No se encontraron productos.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(p => {
        const inCart = currentCart[p.id] ? currentCart[p.id].qty : 0;
        const stockNum = Number(p.stock) || 0;
        const isLow = stockNum <= 5;
        const prodName = p.name || p.nombre || 'Producto';
        const prodPrice = Number(p.price || p.precio) || 0;
        const imgSrc = resolveImageSrc(p);
        const cat = p.category || p.categoria || 'otros';

        return `
          <div class="prod-card" onclick="addProductToCart(${p.id})">
            <div class="prod-qty-badge" id="badge_qty_${p.id}" style="${inCart > 0 ? 'display:flex;' : 'display:none;'}">${inCart}</div>
            
            <div class="prod-img-box">
              <img src="${imgSrc}" onerror="handleImageError(this, '${cat}', '${prodName.replace(/'/g, "\\'")}')" alt="${prodName}" loading="lazy">
              <div class="prod-stock-badge ${isLow ? 'low' : ''}">${stockNum > 0 ? stockNum + ' un.' : 'Agotado'}</div>
            </div>

            <div class="prod-info">
              <div class="prod-name" title="${prodName}">${prodName}</div>
              <div class="prod-price-row">
                <span class="prod-price">$${prodPrice.toLocaleString('es-CO')}</span>
                <button type="button" class="btn-add-prod" onclick="event.stopPropagation(); addProductToCart(${p.id})">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addProductToCart(prodId) {
      const prod = allProducts.find(p => p.id === prodId);
      if (!prod) return;

      if (!currentCart[prodId]) {
        currentCart[prodId] = {
          id: prod.id,
          name: prod.name || prod.nombre,
          price: Number(prod.price || prod.precio) || 0,
          image: resolveImageSrc(prod),
          qty: 1
        };
      } else {
        currentCart[prodId].qty += 1;
      }

      if (navigator.vibrate) navigator.vibrate(30);

      updateCartBadge(prodId);
      updateBottomBar();
    }

    function removeProductFromCart(prodId) {
      if (currentCart[prodId]) {
        currentCart[prodId].qty -= 1;
        if (currentCart[prodId].qty <= 0) {
          delete currentCart[prodId];
        }
      }
      if (navigator.vibrate) navigator.vibrate(20);
      updateCartBadge(prodId);
      updateBottomBar();
      renderDrawerItems();
    }

    function updateCartBadge(prodId) {
      const badge = document.getElementById(`badge_qty_${prodId}`);
      if (badge) {
        const qty = currentCart[prodId] ? currentCart[prodId].qty : 0;
        badge.textContent = qty;
        badge.style.display = qty > 0 ? 'flex' : 'none';
      }
    }

    function getCartTotals() {
      let count = 0;
      let total = 0;
      Object.values(currentCart).forEach(item => {
        count += item.qty;
        total += (item.price * item.qty);
      });
      return { count, total };
    }

    function updateBottomBar() {
      const { count, total } = getCartTotals();
      const bar = document.getElementById('cartBottomBar');
      if (count > 0) {
        bar.style.display = 'flex';
        document.getElementById('lblBottomCount').innerHTML = `<i class="fa-solid fa-basket-shopping"></i> ${count} ${count === 1 ? 'PRODUCTO' : 'PRODUCTOS'}`;
        document.getElementById('lblBottomTotal').textContent = `$${total.toLocaleString('es-CO')}`;
      } else {
        bar.style.display = 'none';
        closeCartDrawer();
      }
    }

    function openCartDrawer() {
      document.getElementById('lblDrawerMesa').textContent = selectedMesa;
      renderDrawerItems();
      document.getElementById('cartDrawerOverlay').classList.add('active');
    }

    function closeCartDrawer() {
      document.getElementById('cartDrawerOverlay').classList.remove('active');
    }

    function renderDrawerItems() {
      const items = Object.values(currentCart);
      const container = document.getElementById('drawerItemsList');
      const { total } = getCartTotals();

      document.getElementById('lblDrawerTotal').textContent = `$${total.toLocaleString('es-CO')}`;

      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 25px 0; color: #64748b;">
            <i class="fa-solid fa-basket-shopping" style="font-size: 26px;"></i>
            <p style="margin-top: 6px; font-size: 12px;">No hay productos en la comanda.</p>
          </div>
        `;
        document.getElementById('btnSendOrder').disabled = true;
        return;
      }

      document.getElementById('btnSendOrder').disabled = false;
      container.innerHTML = items.map(item => `
        <div class="cart-item-row">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">$${(item.price * item.qty).toLocaleString('es-CO')} <span style="color:#64748b; font-size:10px;">($${item.price.toLocaleString('es-CO')} c/u)</span></div>
          </div>
          <div class="cart-item-stepper">
            <button type="button" class="btn-step ${item.qty === 1 ? 'del' : ''}" onclick="removeProductFromCart(${item.id})">
              <i class="fa-solid ${item.qty === 1 ? 'fa-trash' : 'fa-minus'}"></i>
            </button>
            <span class="step-val">${item.qty}</span>
            <button type="button" class="btn-step" onclick="addProductToCart(${item.id}); renderDrawerItems();">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function submitOrderToCaja() {
      const items = Object.values(currentCart);
      if (items.length === 0) return;

      const noteVal = document.getElementById('txtOrderNote').value || '';
      const { total } = getCartTotals();
      const btn = document.getElementById('btnSendOrder');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO A CAJA...`;

      try {
        const payload = {
          mesa: selectedMesa,
          empleado: currentEmployee,
          items: items.map(i => ({
            id: i.id,
            name: i.name,
            price: i.price,
            qty: i.qty,
            image: i.image
          })),
          nota: noteVal,
          total: total
        };

        const res = await fetch('/api/pedidos/crear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`El servidor respondió con código ${res.status}`);
        const data = await res.json();

        if (data.success) {
          closeCartDrawer();
          document.getElementById('lblSuccessMsg').innerHTML = `
            Comanda para <strong>${selectedMesa}</strong> por <strong>$${total.toLocaleString('es-CO')}</strong> enviada exitosamente a la caja física.
          `;
          document.getElementById('successModal').classList.add('active');
          if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 150]);
        } else {
          throw new Error(data.error || 'No se pudo registrar la comanda');
        }
      } catch (err) {
        alert('❌ Error al enviar el pedido a la caja:\n' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ENVIAR PEDIDO A CAJA`;
      }
    }

    function resetNewOrder() {
      currentCart = {};
      document.getElementById('txtOrderNote').value = '';
      document.getElementById('successModal').classList.remove('active');
      document.querySelectorAll('.prod-qty-badge').forEach(b => {
        b.textContent = '0';
        b.style.display = 'none';
      });
      updateBottomBar();
      loadCatalog();
    }
  </script>
</body>
</html>
