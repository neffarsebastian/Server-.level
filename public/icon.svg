<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="16 10" opacity="0.8"/>
  <circle cx="256" cy="230" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.9"/>
  <circle cx="256" cy="230" r="70" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
  
  <!-- Glow behind icon -->
  <circle cx="256" cy="230" r="48" fill="#ffd700" opacity="0.15" filter="url(#glow)"/>

  <!-- Satellite / Dish Core Icon -->
  <g transform="translate(196, 170) scale(0.24)" fill="url(#goldGrad)">
    <path d="M192 0C86 0 0 86 0 192c0 77.4 46.1 144 112 173.6V480c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32V365.6C337.9 336 384 269.4 384 192C384 86 298 0 192 0zm0 64a128 128 0 1 1 0 256 128 128 0 1 1 0-256z"/>
    <circle cx="192" cy="192" r="48" fill="#00f3ff"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="-apple-system, Montserrat, Orbitron, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    LEVEL
  </text>
  <text x="256" y="460" font-family="-apple-system, Montserrat, Rajdhani, sans-serif" font-weight="800" font-size="24" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">
    REMOTE POS
  </text>
</svg>